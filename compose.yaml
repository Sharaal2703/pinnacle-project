services:
  db:
    image: postgres:16-alpine
    container_name: mindbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindbridge}
      POSTGRES_USER: ${POSTGRES_USER:-mindbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mindbridge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindbridge} -d ${POSTGRES_DB:-mindbridge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mindbridge_postgres_data:
